services:
  - type: web
    name: vinayagamoorthy-api
    runtime: python
    plan: free
    rootDir: vinayagamoorthy-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false # set this in Render dashboard (MongoDB Atlas connection string)
      - key: DB_NAME
        value: vinayagamoorthy
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # set this in Render dashboard (free key from aistudio.google.com/app/apikey)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: ENV
        value: production
